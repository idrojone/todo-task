# ============================================================
# Task API - Base Configuration
# ============================================================

spring:
  application:
    name: task-api
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/task_db}
  graphql:
    schema:
      file-extensions: .graphqls,.gqls,.graphql
    graphiql:
      enabled: ${GRAPHQL_GRAPHIQL_ENABLED:true}
    cors:
      allowed-origins: ${GRAPHQL_CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET,POST,OPTIONS
      allowed-headers: "*"
      allow-credentials: false

server:
  port: ${SPRING_SERVER_PORT:8082}

logging:
  level:
    org.springframework.graphql: INFO
    me.idrojone.task: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always